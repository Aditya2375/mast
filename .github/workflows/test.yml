name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make build/test-unit
      - run: ./build/test-unit
  sockets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make && sh tests/run-tests.sh && sh tests/check-docs.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make sanitize
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make build/test-fuzz
      - name: mutated + random blobs (several seeds)
        run: |
          for seed in 1 2 3 4 5 6 7 8 20261101; do
            python3 tests/fuzz.py --programs 100 --blobs 60 --seed "$seed"
          done
      - name: fuzz under sanitizers
        run: |
          make clean
          make EXTRA="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer" build/test-fuzz
          UBSAN_OPTIONS=halt_on_error=1 python3 tests/fuzz.py --programs 50 --blobs 300
      - name: stateful socket fuzz (live server, random sessions)
        run: |
          make build/mast
          # guard: the plain step must really run the plain binary
          if nm build/mast | grep -q __asan_init; then
            echo "fuzz-sockets plain step would run an ASan binary"; exit 1
          fi
          python3 tests/fuzz-sockets.py --sessions 60 --seed 20261201
      - name: stateful socket fuzz under sanitizers
        run: |
          # make would call the existing plain binary "up to date": force it
          rm -f build/mast
          make EXTRA="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer" build/mast
          # guard: prove the binary really carries ASan before trusting the step
          nm build/mast | grep -q __asan_init || { echo "sanitized build/mast has no ASan symbols"; exit 1; }
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tests/fuzz-sockets.py --sessions 25 --seed 20261202
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: 6.0.13
      - name: rebuild the demo strictly from source
        # deleting docs/ first proves the workflow never leans on the
        # committed artifact: the build must regenerate it wholesale
        run: |
          rm -rf docs/
          git checkout -- docs/index.html docs/404.html docs/robots.txt docs/sitemap.xml docs/llms.txt
          sh wasm/build.sh
      - run: node tests/wasm-smoke.js
      - name: committed demo matches a fresh build
        run: git diff --exit-code --stat docs/
